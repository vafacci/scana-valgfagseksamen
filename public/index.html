    <style id="expo-reset">
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0f1b2b;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;

      }
      button {
        -webkit-appearance: none;
        appearance: none;
        font: inherit;
        color: inherit;
      }
    </style>
    <script>
      // Kill every service worker + cache. Old shells were freezing the PWA.
      (function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          });
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key);
            });
          });
        }
      })();
    </script>
  </head>

    <div id="root"></div>
  </body>
